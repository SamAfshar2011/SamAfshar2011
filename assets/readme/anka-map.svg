<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">ANKA architecture map</title>
  <desc id="desc">Eight user inputs flow through feature engineering and a TensorFlow dense model into risk bands, recommendations, simulation, contextual assistance, and report verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120e0a"/><stop offset="1" stop-color="#17110c"/></linearGradient>
    <pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#b99369" stroke-opacity=".055"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ffb45c" fill-opacity=".58"/></marker>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/><rect width="1200" height="340" rx="24" fill="url(#g)"/>
  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="44" y="48" fill="#fff0df" font-size="22" font-weight="750">ANKA / EARTHQUAKE-RISK DECISION SUPPORT</text>
    <text x="44" y="72" fill="#aa8e73" font-size="13">preliminary and educational by design · not a certified structural inspection</text>
  </g>
  <g fill="none" stroke="#ffb45c" stroke-opacity=".4" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M192 158H272"/><path d="M475 158H555"/><path d="M744 158H820"/>
    <path d="M915 133V104H1035"/><path d="M915 158H1035"/><path d="M915 183V222H1035"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <g transform="translate(44 115)"><rect width="148" height="86" rx="14" fill="#20160f" stroke="#ffb45c" stroke-opacity=".25"/><text x="17" y="29" fill="#fff5ea" font-size="13" font-weight="700">8 USER INPUTS</text><text x="17" y="50" fill="#ad8f72" font-size="10">building + seismic</text><text x="17" y="67" fill="#ad8f72" font-size="10">characteristics</text></g>
    <g transform="translate(272 110)"><rect width="203" height="96" rx="14" fill="#20160f" stroke="#ffb45c" stroke-opacity=".28"/><text x="17" y="30" fill="#fff5ea" font-size="12.5" font-weight="700">FEATURE ENGINEERING</text><text x="17" y="52" fill="#ad8f72" font-size="10.2">seismic stress · mass proxy</text><text x="17" y="69" fill="#ad8f72" font-size="10.2">liquefaction · age/height</text></g>
    <g transform="translate(555 110)"><rect width="189" height="96" rx="14" fill="#20160f" stroke="#ffb45c" stroke-opacity=".3"/><text x="17" y="29" fill="#fff5ea" font-size="12.5" font-weight="700">TENSORFLOW DENSE</text><text x="17" y="51" fill="#ad8f72" font-size="10.2">23 preprocessed inputs</text><text x="17" y="69" fill="#ad8f72" font-size="10.2">collapse-risk estimate</text></g>
    <g transform="translate(820 110)"><rect width="190" height="96" rx="14" fill="#20160f" stroke="#ffb45c" stroke-opacity=".3"/><text x="17" y="29" fill="#fff5ea" font-size="12.5" font-weight="700">RISK INTERPRETATION</text><text x="17" y="50" fill="#ad8f72" font-size="10.2">0–25 · 26–50</text><text x="17" y="68" fill="#ad8f72" font-size="10.2">51–75 · 76–100</text></g>
    <g transform="translate(1035 76)"><rect width="121" height="58" rx="12" fill="#1d150f" stroke="#ffb45c" stroke-opacity=".2"/><text x="13" y="25" fill="#fbe7d0" font-size="10.5" font-weight="700">RULE GUIDANCE</text><text x="13" y="43" fill="#9e8167" font-size="9.5">EN · FA · TR</text></g>
    <g transform="translate(1035 145)"><rect width="121" height="58" rx="12" fill="#1d150f" stroke="#ffb45c" stroke-opacity=".2"/><text x="13" y="25" fill="#fbe7d0" font-size="10.5" font-weight="700">2D SIMULATOR</text><text x="13" y="43" fill="#9e8167" font-size="9.5">educational</text></g>
    <g transform="translate(1035 214)"><rect width="121" height="58" rx="12" fill="#1d150f" stroke="#ffb45c" stroke-opacity=".2"/><text x="13" y="25" fill="#fbe7d0" font-size="10" font-weight="700">AI + REPORTS</text><text x="13" y="43" fill="#9e8167" font-size="9.3">context · verify</text></g>

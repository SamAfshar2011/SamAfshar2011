  <path d="M44 270 C160 250 210 292 330 268 S520 246 630 270 S820 294 938 264 S1080 252 1156 270" fill="none" stroke="#ffb45c" stroke-opacity=".17" stroke-width="2"/>
  <text x="44" y="309" fill="#8b725d" font-size="12" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Outputs stay contextual: risk interpretation, rule guidance, educational simulation, contextual assistance, and report verification.</text>

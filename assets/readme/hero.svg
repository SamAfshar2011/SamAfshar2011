<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Sam Afshar — building complete intelligent systems</title>
  <desc id="desc">An original systems map connecting finance intelligence, earthquake safety, and computer vision projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="0.58" stop-color="#10141d"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#b9c7ff" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#66d9c4" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9aa6b8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="440" rx="28" fill="url(#halo)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M790 118 C870 118 862 190 950 190 S1035 133 1132 133" stroke="#5fe0bf" stroke-opacity=".42" stroke-width="2"/>
    <path d="M790 220 C870 220 870 220 950 220 S1044 220 1132 220" stroke="#ffb45c" stroke-opacity=".45" stroke-width="2"/>
    <path d="M790 322 C874 322 866 252 950 252 S1035 308 1132 308" stroke="#71a9ff" stroke-opacity=".48" stroke-width="2"/>
    <path d="M746 106V334" stroke="#b9c7ff" stroke-opacity=".12"/>
  </g>

  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="62" y="70" fill="#aab3c2" font-size="14" font-weight="600" letter-spacing="3">SAM AFSHAR / ENGINEERING PORTFOLIO</text>
    <text x="62" y="152" fill="#f5f7fb" font-size="55" font-weight="760" letter-spacing="-2">BUILD THE WHOLE</text>
    <text x="62" y="211" fill="#f5f7fb" font-size="55" font-weight="760" letter-spacing="-2">SYSTEM.</text>
    <text x="64" y="263" fill="#aab3c2" font-size="18">AI, machine learning, software engineering, and product experiments</text>
    <text x="64" y="294" fill="#aab3c2" font-size="18">where the model is only one part of the work.</text>

    <g transform="translate(62 342)">
      <rect width="470" height="44" rx="22" fill="#151b25" stroke="#98a3b5" stroke-opacity=".18"/>
      <circle cx="24" cy="22" r="5" fill="#d7dfef"/>
      <text x="42" y="27" fill="#c8d0dd" font-size="13.5" font-weight="600" letter-spacing=".7">PYTHON / 2024  >  SYSTEMS / IN PROGRESS</text>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <text x="790" y="88" fill="#718096" font-size="11" letter-spacing="1.5">SELECTED SYSTEMS</text>

      <g transform="translate(790 100)">
        <circle cx="0" cy="18" r="5" fill="#5fe0bf"/>
        <text x="18" y="13" fill="#f3f6f9" font-size="14" font-weight="700">FISCORA</text>
        <text x="18" y="34" fill="#8fa0b3" font-size="11.5">transactions > analysis > forecast</text>
      </g>
      <g transform="translate(790 202)">
        <circle cx="0" cy="18" r="5" fill="#ffb45c"/>
        <text x="18" y="13" fill="#f3f6f9" font-size="14" font-weight="700">ANKA</text>
        <text x="18" y="34" fill="#8fa0b3" font-size="11.5">inputs > risk model > guidance</text>
      </g>
      <g transform="translate(790 304)">
        <circle cx="0" cy="18" r="5" fill="#71a9ff"/>
        <text x="18" y="13" fill="#f3f6f9" font-size="14" font-weight="700">PLATEHUNTER</text>
        <text x="18" y="34" fill="#8fa0b3" font-size="11.5">frame > detect > classify > track</text>
      </g>
    </g>
  </g>

  <g>
    <circle cx="746" cy="220" r="34" fill="#111723" stroke="#dbe4f6" stroke-opacity=".22"/>
    <circle cx="746" cy="220" r="53" fill="none" stroke="#dbe4f6" stroke-opacity=".08"/>
    <circle cx="746" cy="220" r="74" fill="none" stroke="#dbe4f6" stroke-opacity=".04"/>
    <text x="746" y="227" text-anchor="middle" fill="#f3f6f9" font-size="20" font-weight="750" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">SA</text>
  </g>

  <g fill="#c9d4e8">
    <circle cx="950" cy="190" r="4"/>
    <circle cx="950" cy="220" r="4"/>
    <circle cx="950" cy="252" r="4"/>
    <circle cx="1132" cy="133" r="3" fill="#5fe0bf"/>
    <circle cx="1132" cy="220" r="3" fill="#ffb45c"/>
    <circle cx="1132" cy="308" r="3" fill="#71a9ff"/>
  </g>
</svg>

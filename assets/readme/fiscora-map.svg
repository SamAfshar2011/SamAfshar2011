<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Fiscora architecture map</title>
  <desc id="desc">A truthful architecture summary separating deterministic finance logic, behavior forecasting, Bitcoin experimentation, OCR, and grounded assistance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1112"/><stop offset="1" stop-color="#0d1718"/></linearGradient>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6f9b90" stroke-opacity=".06"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5fe0bf" fill-opacity=".55"/></marker>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#g)"/>
  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="44" y="48" fill="#dff8f1" font-size="22" font-weight="750">FISCORA / FINANCIAL INTELLIGENCE</text>
    <text x="44" y="72" fill="#7f9c95" font-size="13">explicit algorithms where auditability matters · learned models where prediction is the experiment</text>
  </g>

  <g fill="none" stroke="#5fe0bf" stroke-opacity=".4" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M190 158H290"/><path d="M495 158H570"/><path d="M770 158H845"/><path d="M1015 158H1032"/>
    <path d="M390 185V245H570"/><path d="M390 130V104H570"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <g transform="translate(44 120)"><rect width="146" height="76" rx="14" fill="#101d1d" stroke="#5fe0bf" stroke-opacity=".24"/><text x="18" y="31" fill="#ecfffa" font-size="13" font-weight="700">TRANSACTIONS</text><text x="18" y="53" fill="#86a59e" font-size="11">manual + OCR</text></g>
    <g transform="translate(290 110)"><rect width="205" height="96" rx="14" fill="#101d1d" stroke="#5fe0bf" stroke-opacity=".3"/><text x="18" y="30" fill="#ecfffa" font-size="13" font-weight="700">DETERMINISTIC CORE</text><text x="18" y="52" fill="#86a59e" font-size="10.5">projection · health · anomalies</text><text x="18" y="70" fill="#86a59e" font-size="10.5">recurring costs · what-if</text></g>
    <g transform="translate(570 82)"><rect width="200" height="66" rx="14" fill="#101d1d" stroke="#5fe0bf" stroke-opacity=".23"/><text x="16" y="28" fill="#ecfffa" font-size="12.5" font-weight="700">BEHAVIOR LSTM</text><text x="16" y="48" fill="#86a59e" font-size="10.5">6 months × 22 features</text></g>
    <g transform="translate(570 170)"><rect width="200" height="72" rx="14" fill="#101d1d" stroke="#5fe0bf" stroke-opacity=".23"/><text x="16" y="28" fill="#ecfffa" font-size="12.5" font-weight="700">BTC EXPERIMENT</text><text x="16" y="48" fill="#86a59e" font-size="10.5">10-day Conv1D/LSTM</text><text x="16" y="63" fill="#6f8e87" font-size="9.5">baseline-checked</text></g>
    <g transform="translate(845 110)"><rect width="170" height="96" rx="14" fill="#101d1d" stroke="#5fe0bf" stroke-opacity=".3"/><text x="16" y="31" fill="#ecfffa" font-size="12.5" font-weight="700">USER CONTEXT</text><text x="16" y="53" fill="#86a59e" font-size="10.5">dashboard · alerts</text><text x="16" y="71" fill="#86a59e" font-size="10.5">grounded AI coach</text></g>
    <g transform="translate(1032 120)"><rect width="124" height="76" rx="14" fill="#0d1919" stroke="#708f88" stroke-opacity=".2"/><text x="15" y="28" fill="#dff8f1" font-size="11.5" font-weight="700">RUNTIME</text><text x="15" y="48" fill="#78958f" font-size="9.8">FastAPI</text><text x="15" y="64" fill="#78958f" font-size="9.8">local JSON</text></g>
  </g>

  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="44" y="306" fill="#65847d" font-size="12">Documented limits: prototype storage/session model · synthetic behavior panel · BTC synthetic future test does not establish a reliable forecasting edge.</text>
  </g>
</svg>

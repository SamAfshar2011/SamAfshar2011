<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">sam.py — who I am, written as code</title>
  <desc id="d">A code editor window describing Sam Afshar as a Python class: born December 2011, started programming in 2024 with Python, focused on AI, machine learning, computer vision and systems, aiming to build a technology startup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="15%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="1200" height="560" rx="26"/></clipPath>
    <style>
      .m text,text.m{white-space:pre}
      .m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
      .s{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif}
      .l{animation:in .5s ease-out both}
      @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
      .cur{animation:b 1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .hl{opacity:0;animation:hl 13s ease-in-out infinite}
      @keyframes hl{0%{opacity:0;transform:translateY(0)}6%,24%{opacity:1;transform:translateY(0)}28%,48%{opacity:1;transform:translateY(112px)}52%,72%{opacity:1;transform:translateY(224px)}76%,94%{opacity:1;transform:translateY(364px)}100%{opacity:0;transform:translateY(364px)}}
      .bar{transform-origin:left;animation:grow 2.6s cubic-bezier(.3,.7,.2,1) both}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .orb{animation:orb 8s ease-in-out infinite}
      @keyframes orb{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}.hl{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="560" fill="url(#bg)"/>
    <rect width="1200" height="560" fill="url(#glow)"/>

    <!-- title bar -->
    <rect width="1200" height="52" fill="#0e1322"/>
    <rect class="bar" y="51" width="1200" height="2" fill="url(#bar)"/>
    <circle cx="30" cy="26" r="7" fill="#ff5f57"/>
    <circle cx="54" cy="26" r="7" fill="#febc2e"/>
    <circle cx="78" cy="26" r="7" fill="#28c840"/>
    <g class="m" font-size="13">
      <rect x="112" y="12" width="128" height="40" rx="8" fill="#0b0f1a"/>
      <text x="132" y="37" fill="#e2e8f0">sam.py</text>
      <circle cx="218" cy="32" r="3.5" fill="#a78bfa"/>
      <text x="262" y="37" fill="#475569">journey.md</text>
      <text x="372" y="37" fill="#475569">roadmap.json</text>
      <text x="1170" y="32" fill="#475569" text-anchor="end">~/profile · python 3</text>
    </g>

    <!-- active line highlight -->
    <rect class="hl" x="0" y="82" width="840" height="28" fill="#a78bfa" fill-opacity=".09"/>

    <!-- gutter -->
    <g class="m" font-size="14" fill="#334155" text-anchor="end">
      <text x="50" y="102">1</text><text x="50" y="130">2</text><text x="50" y="158">3</text><text x="50" y="186">4</text>
      <text x="50" y="214">5</text><text x="50" y="242">6</text><text x="50" y="270">7</text><text x="50" y="298">8</text>
      <text x="50" y="326">9</text><text x="50" y="354">10</text><text x="50" y="382">11</text><text x="50" y="410">12</text>
      <text x="50" y="438">13</text><text x="50" y="466">14</text><text x="50" y="494">15</text><text x="50" y="522">16</text>
    </g>
    <line x1="66" y1="66" x2="66" y2="560" stroke="#1e293b"/>

    <!-- code -->
    <g class="m" font-size="16.5">
      <text class="l" style="animation-delay:.2s" x="86" y="102"><tspan fill="#c084fc">class</tspan> <tspan fill="#67e8f9">SamAfshar</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#fbbf24">Builder</tspan><tspan fill="#94a3b8">):</tspan></text>
      <text class="l" style="animation-delay:.45s" x="86" y="130"><tspan fill="#64748b">    """Started with Python. Stayed for the whole system."""</tspan></text>
      <text class="l" style="animation-delay:.7s" x="86" y="158"><tspan fill="#e2e8f0">    born      </tspan><tspan fill="#f472b6">=</tspan> <tspan fill="#86efac">"December 2011"</tspan></text>
      <text class="l" style="animation-delay:.95s" x="86" y="186"><tspan fill="#e2e8f0">    started   </tspan><tspan fill="#f472b6">=</tspan> <tspan fill="#fdba74">2024</tspan>  <tspan fill="#475569"># first language: Python</tspan></text>
      <text class="l" style="animation-delay:1.2s" x="86" y="214"><tspan fill="#e2e8f0">    focus     </tspan><tspan fill="#f472b6">=</tspan> <tspan fill="#94a3b8">[</tspan><tspan fill="#86efac">"AI"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"ML"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"Computer Vision"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"Systems"</tspan><tspan fill="#94a3b8">]</tspan></text>
      <text class="l" style="animation-delay:1.45s" x="86" y="242"><tspan fill="#e2e8f0">    belief    </tspan><tspan fill="#f472b6">=</tspan> <tspan fill="#86efac">"the model is only one part of the work"</tspan></text>
      <text class="l" style="animation-delay:1.7s" x="86" y="298"><tspan fill="#c084fc">    def</tspan> <tspan fill="#60a5fa">build</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#fca5a5">self</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#e2e8f0">idea</tspan><tspan fill="#94a3b8">):</tspan></text>
      <text class="l" style="animation-delay:1.95s" x="86" y="326"><tspan fill="#e2e8f0">        system </tspan><tspan fill="#f472b6">=</tspan> <tspan fill="#e2e8f0">idea</tspan><tspan fill="#94a3b8">.</tspan><tspan fill="#60a5fa">data</tspan><tspan fill="#94a3b8">().</tspan><tspan fill="#60a5fa">model</tspan><tspan fill="#94a3b8">().</tspan><tspan fill="#60a5fa">validate</tspan><tspan fill="#94a3b8">().</tspan><tspan fill="#60a5fa">interface</tspan><tspan fill="#94a3b8">()</tspan></text>
      <text class="l" style="animation-delay:2.2s" x="86" y="354"><tspan fill="#c084fc">        return</tspan> <tspan fill="#e2e8f0">system</tspan> <tspan fill="#c084fc">if</tspan> <tspan fill="#e2e8f0">system</tspan><tspan fill="#94a3b8">.</tspan><tspan fill="#60a5fa">beats_baseline</tspan><tspan fill="#94a3b8">()</tspan> <tspan fill="#c084fc">else</tspan> <tspan fill="#fca5a5">self</tspan><tspan fill="#94a3b8">.</tspan><tspan fill="#60a5fa">iterate</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#e2e8f0">idea</tspan><tspan fill="#94a3b8">)</tspan></text>
      <text class="l" style="animation-delay:2.45s" x="86" y="410"><tspan fill="#fbbf24">    @property</tspan></text>
      <text class="l" style="animation-delay:2.7s" x="86" y="438"><tspan fill="#c084fc">    def</tspan> <tspan fill="#60a5fa">next</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#fca5a5">self</tspan><tspan fill="#94a3b8">):</tspan></text>
      <text class="l" style="animation-delay:2.95s" x="86" y="466"><tspan fill="#c084fc">        return</tspan> <tspan fill="#86efac">"a startup built on genuinely useful products"</tspan></text>
      <text class="l" style="animation-delay:3.4s" x="86" y="522"><tspan fill="#475569">&gt;&gt;&gt;</tspan> <tspan fill="#67e8f9">SamAfshar</tspan><tspan fill="#94a3b8">().</tspan><tspan fill="#e2e8f0">status</tspan>  <tspan fill="#475569">→</tspan> <tspan fill="#86efac">'learning by building'</tspan><tspan class="cur" fill="#a78bfa"> ▍</tspan></text>
    </g>

    <!-- side panel: mini profile -->
    <g class="orb">
      <g transform="translate(900 92)">
        <rect width="268" height="420" rx="20" fill="#0d1222" stroke="#a5b4fc" stroke-opacity=".14"/>
        <g class="m" font-size="11" fill="#64748b" letter-spacing="1.6">
          <text x="24" y="38">RUNTIME</text>
        </g>
        <!-- avatar monogram -->
        <circle cx="134" cy="112" r="50" fill="none" stroke="url(#bar)" stroke-width="2.5"/>
        <circle cx="134" cy="112" r="42" fill="#111833"/>
        <text x="134" y="124" text-anchor="middle" class="s" font-size="34" font-weight="800" fill="#e2e8f0" letter-spacing="-1">SA</text>
        <circle cx="170" cy="148" r="9" fill="#0d1222"/><circle cx="170" cy="148" r="6" fill="#34d399"/>

        <g class="m" font-size="13">
          <text x="24" y="200" fill="#64748b">mode</text><text x="244" y="200" fill="#e2e8f0" text-anchor="end">builder</text>
          <line x1="24" y1="214" x2="244" y2="214" stroke="#1e293b"/>
          <text x="24" y="238" fill="#64748b">stack</text><text x="244" y="238" fill="#e2e8f0" text-anchor="end">python · ml · cv</text>
          <line x1="24" y1="252" x2="244" y2="252" stroke="#1e293b"/>
          <text x="24" y="276" fill="#64748b">langs</text><text x="244" y="276" fill="#e2e8f0" text-anchor="end">EN · FA</text>
          <line x1="24" y1="290" x2="244" y2="290" stroke="#1e293b"/>
          <text x="24" y="314" fill="#64748b">fuel</text><text x="244" y="314" fill="#e2e8f0" text-anchor="end">curiosity</text>
        </g>
        <g class="m" font-size="11" letter-spacing="1.6" fill="#64748b"><text x="24" y="352">PROGRESS TO STARTUP</text></g>
        <rect x="24" y="366" width="220" height="8" rx="4" fill="#1e293b"/>
        <rect class="bar" style="animation-delay:1s" x="24" y="366" width="88" height="8" rx="4" fill="url(#bar)"/>
        <text class="m" x="244" y="398" font-size="11" fill="#475569" text-anchor="end">loading… honestly</text>
      </g>
    </g>

    <rect x=".75" y=".75" width="1198.5" height="558.5" rx="25.5" fill="none" stroke="#a5b4fc" stroke-opacity=".16"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">02 · ANKA — earthquake-risk decision support</title>
  <desc id="d">Project card: a building sways on a live seismograph while a TensorFlow model's collapse-risk estimate moves across four risk bands, with multilingual guidance. Preliminary and educational, not a certified inspection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120b05"/><stop offset=".6" stop-color="#170f08"/><stop offset="1" stop-color="#0d0805"/></linearGradient>
    <radialGradient id="glow" cx="76%" cy="60%" r="50%"><stop stop-color="#f59e0b" stop-opacity=".17"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset=".33" stop-color="#facc15"/><stop offset=".66" stop-color="#fb923c"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3a2614"/><stop offset="1" stop-color="#22160c"/></linearGradient>
    <pattern id="g" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fbbf24" stroke-opacity=".04"/></pattern>
    <pattern id="win" width="22" height="24" patternUnits="userSpaceOnUse"><rect x="5" y="6" width="11" height="12" rx="1.5" fill="#fbbf24" fill-opacity=".55"/></pattern>
    <filter id="glw" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="1200" height="430" rx="26"/></clipPath>
    <clipPath id="scope"><rect x="0" y="0" width="560" height="90"/></clipPath>
    <style>
      .s{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif}
      .m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
      .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
      .sway2{animation-duration:2.7s;animation-delay:-.6s}
      .sway3{animation-duration:3.6s;animation-delay:-1.2s}
      @keyframes sway{0%,100%{transform:skewX(0)}12%{transform:skewX(3.5deg)}25%{transform:skewX(-3deg)}37%{transform:skewX(2deg)}50%{transform:skewX(-1deg)}62%{transform:skewX(.4deg)}75%{transform:skewX(0)}}
      .ground{animation:shake 3.2s ease-in-out infinite}
      @keyframes shake{0%,100%{transform:translateX(0)}12%{transform:translateX(5px)}25%{transform:translateX(-5px)}37%{transform:translateX(3px)}50%{transform:translateX(-2px)}62%{transform:translateX(1px)}75%{transform:none}}
      .wave{animation:scroll 2.4s linear infinite}
      @keyframes scroll{to{transform:translateX(-160px)}}
      .needle{animation:needle 8s cubic-bezier(.5,.1,.3,1) infinite}
      @keyframes needle{0%,100%{transform:translateX(70px)}25%{transform:translateX(210px)}50%{transform:translateX(330px)}75%{transform:translateX(150px)}}
      .ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}
      @keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(2.6);opacity:0}}
      .lang{opacity:0;animation:lang 6s infinite}
      .l3{animation-delay:3s}
      @keyframes lang{0%{opacity:0}5%,45%{opacity:1}50%,100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}.lang.l1x{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#g)"/>
    <rect width="1200" height="430" fill="url(#glow)"/>

    <!-- left -->
    <text class="s" x="528" y="200" text-anchor="end" font-size="150" font-weight="900" fill="none" stroke="#f59e0b" stroke-opacity=".14" stroke-width="1.5" letter-spacing="-6">02</text>
    <g class="m" font-size="12" letter-spacing="2.2" fill="#fbbf24">
      <rect x="48" y="44" width="226" height="28" rx="14" fill="#2a1a0a" stroke="#f59e0b" stroke-opacity=".38"/>
      <text x="64" y="63">SAFETY · TENSORFLOW</text>
    </g>
    <text class="s" x="46" y="190" font-size="62" font-weight="800" letter-spacing="-2.5" fill="#fff7ed">ANKA</text>
    <text class="s" x="48" y="226" font-size="19" fill="#b89a7c">Earthquake-risk decision support that</text>
    <text class="s" x="48" y="252" font-size="19" fill="#b89a7c">explains the number — and its <tspan fill="#ffedd5" font-weight="700">limits</tspan>.</text>
    <g class="m" font-size="13.5" fill="#d6bfa6">
      <g transform="translate(48 292)"><circle cx="6" cy="-5" r="4" fill="#fbbf24"/><text x="22">8 inputs → engineered features → dense net</text></g>
      <g transform="translate(48 320)"><circle cx="6" cy="-5" r="4" fill="#fb923c"/><text x="22">4 risk bands · guidance in EN / FA / TR</text></g>
      <g transform="translate(48 348)"><circle cx="6" cy="-5" r="4" fill="#ef4444"/><text x="22">2D quake simulator with its own physics loop</text></g>
      <g transform="translate(48 376)"><circle cx="6" cy="-5" r="4" fill="#34d399"/><text x="22">PDF reports + verification registry</text></g>
    </g>

    <!-- right panel -->
    <g transform="translate(560 40)">
      <rect width="600" height="350" rx="22" fill="#1a1009" stroke="#f59e0b" stroke-opacity=".22"/>
      <g class="m" font-size="11" letter-spacing="1.6" fill="#8b6a4c">
        <text x="26" y="36">LIVE SCENARIO</text>
        <text x="574" y="36" text-anchor="end" fill="#6b5039">educational · not certified</text>
      </g>

      <!-- epicenter rings -->
      <g transform="translate(420 214)">
        <circle class="ring" r="20" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <circle class="ring" style="animation-delay:1.06s" r="20" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <circle class="ring" style="animation-delay:2.13s" r="20" fill="none" stroke="#f59e0b" stroke-width="2"/>
      </g>

      <!-- buildings -->
      <g class="ground">
        <g class="sway">
          <rect x="70" y="96" width="92" height="118" rx="3" fill="url(#bld)" stroke="#f59e0b" stroke-opacity=".35"/>
          <rect x="70" y="96" width="92" height="118" fill="url(#win)" transform="translate(4 4)" opacity=".85"/>
          <rect x="66" y="92" width="100" height="6" rx="2" fill="#f59e0b" fill-opacity=".6"/>
        </g>
        <g class="sway sway2">
          <rect x="182" y="132" width="70" height="82" rx="3" fill="url(#bld)" stroke="#f59e0b" stroke-opacity=".3"/>
          <rect x="182" y="132" width="66" height="80" fill="url(#win)" transform="translate(2 2)" opacity=".7"/>
        </g>
        <g class="sway sway3">
          <rect x="270" y="74" width="60" height="140" rx="3" fill="url(#bld)" stroke="#f59e0b" stroke-opacity=".3"/>
          <rect x="270" y="74" width="56" height="138" fill="url(#win)" transform="translate(2 4)" opacity=".6"/>
          <line x1="300" y1="74" x2="300" y2="56" stroke="#f59e0b" stroke-opacity=".6" stroke-width="2"/>
          <circle cx="300" cy="54" r="3" fill="#ef4444"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
        </g>
        <rect x="40" y="214" width="520" height="3" rx="1.5" fill="#f59e0b" fill-opacity=".45"/>
      </g>

      <!-- seismograph -->
      <g transform="translate(20 222)" clip-path="url(#scope)">
        <g class="wave" filter="url(#glw)">
          <path d="M0 38 h20 l6 -8 l6 14 l6 -22 l7 34 l6 -28 l7 18 l6 -10 l6 4 h30 l5 -4 l5 6 l5 -3 h14 m0 0 h20 l6 -8 l6 14 l6 -22 l7 34 l6 -28 l7 18 l6 -10 l6 4 h30 l5 -4 l5 6 l5 -3 h14 m0 0 h20 l6 -8 l6 14 l6 -22 l7 34 l6 -28 l7 18 l6 -10 l6 4 h30 l5 -4 l5 6 l5 -3 h14 m0 0 h20 l6 -8 l6 14 l6 -22 l7 34 l6 -28 l7 18 l6 -10 l6 4 h30 l5 -4 l5 6 l5 -3 h14 m0 0 h20 l6 -8 l6 14 l6 -22 l7 34 l6 -28 l7 18 l6 -10 l6 4 h30 l5 -4 l5 6 l5 -3 h14" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- risk meter -->
      <g transform="translate(26 292)">
        <rect width="420" height="12" rx="6" fill="url(#risk)" opacity=".9"/>
        <g class="m" font-size="10" fill="#8b6a4c" letter-spacing="1">
          <text x="0" y="34">LOW</text><text x="105" y="34">MODERATE</text><text x="232" y="34">HIGH</text><text x="420" y="34" text-anchor="end">CRITICAL</text>
        </g>
        <g class="needle">
          <path d="M0 -6 l-7 -10 h14z" fill="#fff7ed"/>
          <rect x="-1.5" y="-4" width="3" height="20" rx="1.5" fill="#fff7ed"/>
        </g>
      </g>

      <!-- language bubble -->
      <g transform="translate(472 274)">
        <rect width="104" height="52" rx="14" fill="#2a1a0a" stroke="#f59e0b" stroke-opacity=".3"/>
        <text class="m" x="14" y="20" font-size="9.5" fill="#8b6a4c" letter-spacing="1.2">GUIDANCE</text>
        <g class="s" font-size="15" font-weight="700" fill="#ffedd5">
          <text class="lang l1x" x="14" y="41">Stay calm</text>
          <text class="lang l3" x="14" y="41">Sakin olun</text>
        </g>
      </g>
    </g>
    <rect x=".75" y=".75" width="1198.5" height="428.5" rx="25.5" fill="none" stroke="#f59e0b" stroke-opacity=".2"/>
  </g>
</svg>

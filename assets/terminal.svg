<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="t d">
  <title id="t">sudo hire sam</title>
  <desc id="d">An easter-egg terminal session: a recruiter runs sudo hire sam; the terminal verifies three shipped AI systems, two gold and one silver medal, the IFIA Inv title, and prints ACCESS GRANTED.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0a0d16"/><stop offset="1" stop-color="#05070c"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#e2e8f0" fill-opacity=".025"/></pattern>
    <radialGradient id="crt" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <clipPath id="c"><rect width="1200" height="490" rx="22"/></clipPath>
    <style>
      .m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}
      .s{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .flick{animation:fl 6s steps(1) infinite}
      @keyframes fl{0%,96%,100%{opacity:1}97%{opacity:.82}98%{opacity:1}99%{opacity:.9}}
      @keyframes l0{0%,2.22%{opacity:0;clip-path:inset(0 100% 0 0)}2.28%{opacity:1;clip-path:inset(0 39.4% 0 0)}4.17%{opacity:1;clip-path:inset(0 39.4% 0 0)}8.14%,92.22%{opacity:1;clip-path:inset(0 0 0 0)}94.44%,100%{opacity:0;clip-path:inset(0 0 0 0)}}.l0{animation:l0 18.0s linear infinite}@keyframes l1{0%,11.11%{opacity:0;transform:translateX(-6px)}12.11%,92.22%{opacity:1;transform:none}94.44%,100%{opacity:0}}.l1{animation:l1 18.0s ease-out infinite}@keyframes l2{0%,16.67%{opacity:0;transform:translateX(-6px)}17.67%,92.22%{opacity:1;transform:none}94.44%,100%{opacity:0}}.l2{animation:l2 18.0s ease-out infinite}@keyframes l3{0%,21.11%{opacity:0;transform:translateX(-6px)}22.11%,92.22%{opacity:1;transform:none}94.44%,100%{opacity:0}}.l3{animation:l3 18.0s ease-out infinite}@keyframes l4{0%,24.44%{opacity:0;transform:translateX(-6px)}25.44%,92.22%{opacity:1;transform:none}94.44%,100%{opacity:0}}.l4{animation:l4 18.0s ease-out infinite}@keyframes l5{0%,27.78%{opacity:0;transform:translateX(-6px)}28.78%,92.22%{opacity:1;transform:none}94.44%,100%{opacity:0}}.l5{animation:l5 18.0s ease-out infinite}@keyframes l6{0%,31.11%{opacity:0;transform:translateX(-6px)}32.11%,92.22%{opacity:1;transform:none}94.44%,100%{opacity:0}}.l6{animation:l6 18.0s ease-out infinite}@keyframes l7{0%,34.44%{opacity:0;transform:translateX(-6px)}35.44%,92.22%{opacity:1;transform:none}94.44%,100%{opacity:0}}.l7{animation:l7 18.0s ease-out infinite}@keyframes l8{0%,38.89%{opacity:0;transform:translateX(-6px)}39.89%,92.22%{opacity:1;transform:none}94.44%,100%{opacity:0}}.l8{animation:l8 18.0s ease-out infinite}@keyframes pb{0%,40.00%{transform:scaleX(0)}50.56%,92.22%{transform:scaleX(1)}94.44%,100%{transform:scaleX(1)}}.pb{transform-box:fill-box;transform-origin:left;animation:pb 18.0s cubic-bezier(.5,.1,.3,1) infinite}@keyframes pct{0%,50.56%{opacity:0}51.11%,92.22%{opacity:1}94.44%,100%{opacity:0}}.pct{animation:pct 18.0s linear infinite}@keyframes l9{0%,52.22%{opacity:0;transform:translateX(-6px)}53.22%,92.22%{opacity:1;transform:none}94.44%,100%{opacity:0}}.l9{animation:l9 18.0s ease-out infinite}@keyframes l10{0%,58.89%{opacity:0;clip-path:inset(0 100% 0 0)}58.94%{opacity:1;clip-path:inset(0 70.8% 0 0)}60.83%{opacity:1;clip-path:inset(0 70.8% 0 0)}71.22%,92.22%{opacity:1;clip-path:inset(0 0 0 0)}94.44%,100%{opacity:0;clip-path:inset(0 0 0 0)}}.l10{animation:l10 18.0s linear infinite}@keyframes l11{0%,70.00%{opacity:0;transform:translateX(-6px)}71.00%,92.22%{opacity:1;transform:none}94.44%,100%{opacity:0}}.l11{animation:l11 18.0s ease-out infinite}@keyframes cl{0%,72.22%{opacity:0}72.78%,92.22%{opacity:1}94.44%,100%{opacity:0}}.cl{animation:cl 18.0s linear infinite}@keyframes st{0%,52.22%{opacity:0;transform:scale(2.2) rotate(-10deg)}54.17%,92.22%{opacity:1;transform:scale(1) rotate(-10deg)}94.44%,100%{opacity:0;transform:scale(1) rotate(-10deg)}}.st{transform-box:fill-box;transform-origin:center;animation:st 18.0s cubic-bezier(.3,1.6,.5,1) infinite}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="490" fill="url(#bg)"/>
    <rect width="1200" height="52" fill="#0f1322"/>
    <circle cx="30" cy="26" r="7" fill="#ff5f57"/><circle cx="54" cy="26" r="7" fill="#febc2e"/><circle cx="78" cy="26" r="7" fill="#28c840"/>
    <text class="m" x="600" y="31" font-size="13" fill="#64748b" text-anchor="middle">recruiter@github — zsh — 120×32</text>
    <g class="flick">
            <text class="m l0" x="44" y="96" font-size="16.5"><tspan fill="#34d399">recruiter@github</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#f8fafc">sudo hire sam</tspan></text>
      <text class="m l1" x="44" y="125" font-size="16.5"><tspan fill="#94a3b8">[sudo] password for recruiter: </tspan><tspan fill="#64748b">••••••••</tspan></text>
      <text class="m l2" x="44" y="154" font-size="16.5"><tspan fill="#a78bfa">→ </tspan><tspan fill="#e2e8f0">verifying candidate </tspan><tspan fill="#fde68a">Inv. Sam Afshar</tspan><tspan fill="#64748b"> …</tspan></text>
      <text class="m l3" x="44" y="183" font-size="16.5"><tspan fill="#34d399">  ✓ </tspan><tspan fill="#e2e8f0">3 complete AI systems shipped         </tspan><tspan fill="#64748b">Fiscora · ANKA · PlateHunter</tspan></text>
      <text class="m l4" x="44" y="212" font-size="16.5"><tspan fill="#34d399">  ✓ </tspan><tspan fill="#e2e8f0">2× gold · 1× silver                   </tspan><tspan fill="#64748b">IFIA Geneva · 1Idea1World · INNOVERSE</tspan></text>
      <text class="m l5" x="44" y="241" font-size="16.5"><tspan fill="#34d399">  ✓ </tspan><tspan fill="#e2e8f0">IFIA “Inv” title                      </tspan><tspan fill="#c4b5fd">IR2026MAY2987SXA</tspan></text>
      <text class="m l6" x="44" y="270" font-size="16.5"><tspan fill="#34d399">  ✓ </tspan><tspan fill="#e2e8f0">born 2011 · first line of code 2024   </tspan><tspan fill="#64748b">(yes, really)</tspan></text>
      <text class="m l7" x="44" y="299" font-size="16.5"><tspan fill="#fbbf24">  ! </tspan><tspan fill="#fbbf24">warning: </tspan><tspan fill="#e2e8f0">candidate refuses to ship confident-looking nonsense</tspan></text>
      <text class="m l8" x="44" y="328" font-size="16.5"><tspan fill="#a78bfa">→ loading ambition  </tspan></text>
      <g class="l8"><rect x="244" y="314" width="360" height="16" rx="4" fill="#1e293b"/><rect class="pb" x="244" y="314" width="360" height="16" rx="4" fill="url(#acc)"/><text class="m pct" x="618" y="328" font-size="16.5" fill="#34d399">100%</text></g>
      <text class="m l9" x="44" y="357" font-size="16.5"><tspan fill="#34d399">ACCESS GRANTED</tspan><tspan fill="#64748b">  ·  </tspan><tspan fill="#e2e8f0">next stop: a startup built on genuinely useful products</tspan></text>
      <text class="m l10" x="44" y="386" font-size="16.5"><tspan fill="#f472b6">sam@future</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#64748b">$ </tspan><tspan fill="#f8fafc">echo &quot;let&#x27;s build something real.&quot;</tspan></text>
      <text class="m l11" x="44" y="415" font-size="16.5"><tspan fill="#67e8f9">let&#x27;s build something real.</tspan></text>
      <g class="cl"><text class="m" x="44" y="444" font-size="16.5"><tspan fill="#f472b6">sam@future</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#64748b">$ </tspan><tspan class="cur" fill="#a78bfa">▍</tspan></text></g>
    </g>
    <g class="st"><rect x="880" y="340" width="236" height="64" rx="10" fill="none" stroke="#34d399" stroke-width="3"/>
      <rect x="888" y="348" width="220" height="48" rx="7" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".5"/>
      <text class="s" x="998" y="381" font-size="24" font-weight="900" letter-spacing="4" fill="#34d399" text-anchor="middle">HIRED?</text></g>
    <rect width="1200" height="490" fill="url(#scan)"/>
    <rect width="1200" height="490" fill="url(#crt)"/>
    <rect x=".75" y=".75" width="1198.5" height="488.5" rx="21.5" fill="none" stroke="#a5b4fc" stroke-opacity=".16"/>
  </g>

name: Achievement wall

on:
  push:
    branches: [main]
    paths:
      - data/achievements.json
      - scripts/build_achievements.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redraw the trophy shelf
        run: python scripts/build_achievements.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/achievements.svg; then
            echo "No visual change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/achievements.svg
          git commit -m "Redraw achievement wall"
          git push

name: Profile automation

# Rebuilds the images that live on the `output` branch:
#   snake-dark.svg / snake-light.svg  — the contribution snake
#   live.svg                          — the live status card (scripts/build_live.py)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_live.py
      - .github/workflows/profile.yml
      - data/achievements.json

permissions:
  contents: write

concurrency:
  group: profile-output
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # runs before the snake step: snk runs in Docker as root and would own dist/
      - name: Render the live card
        run: python scripts/build_live.py --out dist/live.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#0d1117,#1e1b4b,#3730a3,#7c3aed,#c4b5fd
            dist/snake-light.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#4c1d95

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
